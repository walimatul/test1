<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Wedding Invitation</title>


    <!-- CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- FONT AWESOME -->
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>



<body class="lock-scroll">


<!-- ==========================
     GLOBAL DUST
=========================== -->

<div class="dust-container">

    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>

</div>


 <!-- DECORATION GLOBAL -->
<img src="assets/images/decoration/bunga-2.png"
class="leaf-decoration leaf1">

 <img src="assets/images/decoration/bunga-4.png"
class="leaf-decoration leaf2">

 <img src="assets/images/decoration/bunga-6.png"
 class="leaf-decoration leaf3">



<!-- ==========================
     PAGE 1 / COVER
=========================== -->

<section class="page page-1">


    <!-- BACKGROUND -->
    <img 
    src="assets/images/background1.png" 
    class="background">


    <!-- FLOWER LEFT -->
    <img 
    src="assets/images/flower-left-01.png" 
    class="flower-left">


    <!-- FLOWER RIGHT -->
    <img 
    src="assets/images/flower-right-01.png" 
    class="flower-right">




    <!-- OTHER SVG / ELEMENT PAGE 1 -->

    <!-- BISMILLAH -->

    <img 
    src="assets/svg/bismillah-01.svg" 
    class="bismillah">

    <!-- RAJAKAN CINTA -->

    <img 
    src="assets/svg/Raikan-cinta-01.svg" 
    class="raikan">

    <img 
    src="assets/svg/name-01.svg" 
    class="name">




    <!-- OPEN BUTTON -->

    <button id="openInvitation">

        Open Invitation

    </button>



</section>







<!-- ==========================
     PAGE 2
=========================== -->


<section class="page page-2">


    <!-- BACKGROUND -->

    <img 
    src="assets/images/background2-02.png" 
    class="background">



    <!-- FLOWER -->

    <img 
    src="assets/images/flower2-02-02.png" 
    class="flower2-02-02">



    <!-- TEXT SVG -->

    <img 
    src="assets/svg/text2-02.svg" 
    class="text2 fadeText">


    <!-- SCROLL INDICATOR -->
    <div class="scroll-indicator">
    <i class="fa-solid fa-angles-down"></i>
    </div>


<!-- DOA BOX -->
<div class="doa-box">

    <img src="assets/svg/doa-line-01.svg" class="doa doa1 delay1">

    <img src="assets/svg/doa-line-02.svg" class="doa doa2 delay2">

    <img src="assets/svg/doa-line-03.svg" class="doa doa3 delay3">

    <img src="assets/svg/doa-line-04.svg" class="doa doa4 delay4">

    </div>



<!-- LOVE BOX -->
<div class="love-box">

    <img src="assets/svg/love-line-01.svg" class="love love1 delay1">

    <img src="assets/svg/love-line-02.svg" class="love love2 delay2">

    <img src="assets/svg/love-line-03.svg" class="love love3 delay3">

</div>
    
</section>

    

<!-- ==========================
     PAGE 3
=========================== -->

<section class="page page-3">


    <!-- BACKGROUND -->

    <img 
    src="assets/images/background3-01.png" 
    class="background">



    <!-- PAGE 3 SVG -->


    <img 
    src="assets/svg/page3/aturcara.svg"
    class="aturcara reveal"> 



    <img 
    src="assets/svg/page3/masa.svg"
    class="masa reveal delay1">


    <div class="countdown-reveal reveal delay2">

    <div class="countdown">

        <div class="time-box box1">
            <span id="days">00</span>
            <small>Hari</small>
        </div>

        <div class="time-box box2">
            <span id="hours">00</span>
            <small>Jam</small>
        </div>

        <div class="time-box box3">
            <span id="minutes">00</span>
            <small>Minit</small>
        </div>

        <div class="time-box box4">
            <span id="seconds">00</span>
            <small>Saat</small>
        </div>

    </div>

</div>



    <img 
    src="assets/svg/page3/icon.svg"
    class="location-icon reveal delay2">



    <img 
    src="assets/svg/page3/ummie.svg"
    class="ummie reveal delay3">



     <a href="https://maps.app.goo.gl/wCRWqKFLyPk7u3Lv7" 
class="map-button reveal delay4">

    <img src="assets/svg/page3/location.svg" class="location-small">

    <span>Lihat Lokasi</span>

</a>


</section>




<!-- ==========================
     MUSIC
=========================== -->


<audio id="bgMusic" loop>

    <source 
    src="assets/music/ARVIAN-DWI-SATU-SHAF-DIBELAKANGKU.mp3"
    type="audio/mpeg">

</audio>






<!-- ==========================
     MUSIC BUTTON
=========================== -->


<button id="musicBtn">

    <i class="fa-solid fa-music"></i>

</button>







<!-- ==========================
     JAVASCRIPT
=========================== -->


<script src="script.js"></script>



</body>


</html>
